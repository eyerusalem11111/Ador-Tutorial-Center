<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF" />
  
  <defs>
    <mask id="ador-svg-mask">
      <rect x="0" y="0" width="1000" height="1000" fill="#FFFFFF" />
      
      <!-- 1. Head intersection slash (45 degree inclined across the apex) -->
      <rect
        x="360"
        y="264"
        width="280"
        height="18"
        transform="rotate(45 500 273)"
        fill="#000000"
      />

      <!-- 2. Left intersection slash (45 degree inclined across left leg and middle line) -->
      <rect
        x="190"
        y="501"
        width="280"
        height="18"
        transform="rotate(45 330 510)"
        fill="#000000"
      />

      <!-- 3. Right intersection slash (45 degree inclined across right leg and middle line) -->
      <rect
        x="530"
        y="501"
        width="280"
        height="18"
        transform="rotate(45 670 510)"
        fill="#000000"
      />
    </mask>
  </defs>

  <!-- Letter A with legs equal to middle line (flush at bottom baseline y=600) -->
  <path
    fill="#0054B6"
    fill-rule="evenodd"
    mask="url(#ador-svg-mask)"
    d="
      M 430 202
      L 570 202
      L 790 600
      L 210 600
      Z
      M 500 345
      L 595 510
      L 405 510
      Z
    "
  />

  <!-- Crisp white 45-degree slashes -->
  <g fill="#FFFFFF">
    <rect
      x="360"
      y="264"
      width="280"
      height="18"
      transform="rotate(45 500 273)"
    />
    <rect
      x="190"
      y="501"
      width="280"
      height="18"
      transform="rotate(45 330 510)"
    />
    <rect
      x="530"
      y="501"
      width="280"
      height="18"
      transform="rotate(45 670 510)"
    />
  </g>

  <!-- Typography -->
  <text
    x="500"
    y="735"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="62"
    font-weight="800"
    fill="#0054B6"
    letter-spacing="-0.5"
  >Ador Tutorial Center</text>
</svg>
